<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="budget-scenario-dark-title budget-scenario-dark-desc" id="budget-scenario-dark-root">
        <title id="budget-scenario-dark-title">A blocked user with budget headroom</title>
        <desc id="budget-scenario-dark-desc">In this hypothetical scenario, the user-level budget is exhausted even though the cost-center metered budget has headroom. The user-level hard stop still blocks credit-consuming work.</desc>
        <defs>
      <style>#budget-scenario-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #budget-scenario-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#budget-scenario-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="budget-scenario-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="504" fill="#07090d"/>
        <path d="M 300,120 V 132 Q 300,140 292,140 H 216 Q 208,140 208,148 V 168" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#budget-scenario-dark-arrow)"/>
        <path d="M 404,120 V 132 Q 404,140 412,140 H 488 Q 496,140 496,148 V 168" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#budget-scenario-dark-arrow)"/>
        <path d="M 208,248 V 260 Q 208,268 216,268 H 292 Q 300,268 300,276 V 296" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#budget-scenario-dark-arrow)"/>
        <g>
      <rect x="192" y="40" width="320" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
      <text x="208" y="70" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Credit-consuming request</text>
      <text x="208" y="94" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Hypothetical user</text>
    </g>
        <g>
      <rect x="88" y="168" width="240" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
      <text x="104" y="198" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">User-level budget</text>
      <text x="104" y="222" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Exhausted: hard stop</text>
    </g>
        <g>
      <rect x="376" y="168" width="240" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
      <text x="392" y="198" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Cost-center metered budget</text>
      <text x="392" y="222" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Headroom remains</text>
    </g>
        <g>
      <rect x="192" y="296" width="320" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
      <text x="208" y="326" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Work is blocked</text>
      <text x="208" y="350" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">User-level budget takes effect</text>
    </g>
        <text x="40" y="416" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Metered headroom does not override the hard stop.</text>
        <line x1="40" y1="444" x2="664" y2="444" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="472" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Box: topic or action    ·    Arrow: relationship</text>
