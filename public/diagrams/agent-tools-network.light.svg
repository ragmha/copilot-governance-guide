        <title id="agent-tools-network-light-title">Review separate execution paths</title>
        <desc id="agent-tools-network-light-desc">Agent work can use Bash-started processes and MCP servers. The firewall directly covers the former, not MCP processes. Review permissions and protections for each path.</desc>
