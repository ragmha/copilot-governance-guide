<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-feature-baseline-dark-title model-feature-baseline-dark-desc" id="model-feature-baseline-dark-root">
        <title id="model-feature-baseline-dark-title">Review availability before rollout</title>
        <desc id="model-feature-baseline-dark-desc">Set separate defaults for features and models, decide whether to enable, disable or delegate each capability, then verify the effective experience and schedule review.</desc>
        <defs>
      <style>#model-feature-baseline-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #model-feature-baseline-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#model-feature-baseline-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="model-feature-baseline-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="488" fill="#07090d"/>
        <line x1="352" y1="120" x2="352" y2="160" stroke="#9198a1" stroke-width="1.5" marker-end="url(#model-feature-baseline-dark-arrow)"/>
        <line x1="352" y1="240" x2="352" y2="280" stroke="#9198a1" stroke-width="1.5" marker-end="url(#model-feature-baseline-dark-arrow)"/>
        <g>
      <rect x="192" y="40" width="320" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
      <text x="208" y="70" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Baseline</text>
      <text x="208" y="94" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Separate feature and model defaults</text>
    </g>
        <g>
      <rect x="192" y="160" width="320" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
      <text x="208" y="190" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Decide</text>
      <text x="208" y="214" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Enable, disable or delegate</text>
    </g>
        <g>
      <rect x="192" y="280" width="320" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
      <text x="208" y="310" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Verify</text>
      <text x="208" y="334" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Audience, client and review date</text>
    </g>
        <text x="40" y="408" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Preview and model exceptions need separate review.</text>
        <line x1="40" y1="428" x2="664" y2="428" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="456" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Rounded box: start or end    ·    Square box: step    ·    Arrow: sequence</text>
        <text x="40" y="472" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
