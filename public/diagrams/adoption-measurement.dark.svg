        <title id="adoption-measurement-dark-title">Interpret adoption in context</title>
        <desc id="adoption-measurement-dark-desc">Define a question and denominator, select a complete reporting period and supported metric, then interpret trends alongside feedback and coverage limitations.</desc>
        <defs>
      <style>#adoption-measurement-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #adoption-measurement-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#adoption-measurement-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="adoption-measurement-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
