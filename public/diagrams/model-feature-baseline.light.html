<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review availability before rollout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; color: #1f2328; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Governance guide · flow</p>
    <h1>Review availability before rollout</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Review availability before rollout. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-feature-baseline-light-title model-feature-baseline-light-desc">
        <title id="model-feature-baseline-light-title">Review availability before rollout</title>
        <desc id="model-feature-baseline-light-desc">Set separate defaults for features and models, decide whether to enable, disable or delegate each capability, then verify the effective experience and schedule review.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="488" fill="#f3f5f7"/>
        <line x1="352" y1="120" x2="352" y2="160" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="352" y1="240" x2="352" y2="280" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <g>
      <rect x="192" y="40" width="320" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
      <text x="208" y="70" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Baseline</text>
      <text x="208" y="94" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Separate feature and model defaults</text>
    </g>
        <g>
      <rect x="192" y="160" width="320" height="80" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
      <text x="208" y="190" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Decide</text>
      <text x="208" y="214" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Enable, disable or delegate</text>
    </g>
        <g>
      <rect x="192" y="280" width="320" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
      <text x="208" y="310" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Verify</text>
      <text x="208" y="334" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Audience, client and review date</text>
    </g>
        <text x="40" y="408" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Preview and model exceptions need separate review.</text>
        <line x1="40" y1="428" x2="664" y2="428" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="456" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Rounded box: start or end    ·    Square box: step    ·    Arrow: sequence</text>
        <text x="40" y="472" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
