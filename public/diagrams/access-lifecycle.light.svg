      #access-lifecycle-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#access-lifecycle-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="access-lifecycle-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
