<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-lifecycle-light-title access-lifecycle-light-desc" id="access-lifecycle-light-root">
        <title id="access-lifecycle-light-title">Maintain the seat lifecycle</title>
        <desc id="access-lifecycle-light-desc">Assign an eligible person, help them onboard, review membership and activity, investigate exceptions, and update the assignment when authorized. Other assignment paths may still apply.</desc>
