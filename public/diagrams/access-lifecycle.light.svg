        <text x="40" y="648" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12">Other assignment paths and removal timing matter.</text>
        <line x1="40" y1="684" x2="664" y2="684" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="712" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Dot: start    ·    Box: state    ·    Arrow: transition</text>
        <text x="40" y="728" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9">Green box: lesson focus, not approval or a safety rating</text>
