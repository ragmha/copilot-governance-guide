      @media print {
#instructions-context-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="instructions-context-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
