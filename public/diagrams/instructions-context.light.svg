<svg viewBox="0 0 704 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="instructions-context-light-title instructions-context-light-desc" id="instructions-context-light-root">
        <title id="instructions-context-light-title">Improve guidance through review</title>
        <desc id="instructions-context-light-desc">Select the audience and supported instruction scope, write task-relevant guidance, then evaluate outputs and update the guidance. Instructions are not permissions.</desc>
